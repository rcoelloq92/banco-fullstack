server:
  port: 8080

spring:
  application:
    name: banco-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banco}
    username: ${DB_USER:banco}
    password: ${DB_PASSWORD:banco123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Reglas de negocio parametrizables
aplicacion:
  movimientos:
    limite-diario-retiro: 1000
